<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Punto de marcación — RR.HH PYMES</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0c4a6e 100%); }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-white">

  <!-- Pantalla de configuración inicial (solo la primera vez que se usa este dispositivo) -->
  <div id="setupScreen" class="w-full max-w-sm hidden">
    <div class="bg-slate-900/80 border border-slate-700 rounded-2xl p-6 shadow-2xl">
      <div class="text-center mb-4">
        <i class="fa-solid fa-tablet-screen-button text-sky-400 text-3xl mb-2"></i>
        <h1 class="font-bold text-lg">Configurar este dispositivo</h1>
        <p class="text-xs text-slate-400 mt-1">Pega aquí el token que te dio tu administrador al crear este dispositivo en la suite (Asistencia → Dispositivos).</p>
      </div>
      <textarea id="setupTokenInput" rows="3" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-600 text-xs font-mono mb-3" placeholder="Pega el token aquí"></textarea>
      <div id="setupError" class="hidden text-xs text-rose-400 mb-3"></div>
      <button onclick="saveDeviceToken()" class="w-full py-2.5 rounded-lg bg-sky-600 hover:bg-sky-700 font-semibold text-sm">Guardar y continuar</button>
    </div>
  </div>

  <!-- Pantalla principal de marcación -->
  <div id="markScreen" class="hidden">
   <div class="fixed inset-0 flex flex-col overflow-y-auto p-2">
    <div class="w-full bg-slate-900/70 border border-slate-700 rounded-2xl p-4 shadow-2xl">
      <div class="flex gap-2 mb-3">
        <button id="modeBtnFacial" onclick="setMode('facial')" class="flex-1 px-3 py-2 rounded-lg text-xs font-bold bg-sky-600">
          <i class="fa-solid fa-camera"></i> Reconocimiento facial
        </button>
        <button id="modeBtnManual" onclick="setMode('manual')" class="flex-1 px-3 py-2 rounded-lg text-xs font-bold bg-slate-700">
          <i class="fa-solid fa-hand-pointer"></i> Selección manual
        </button>
      </div>

      <div id="facialBox">
        <video id="video" autoplay muted playsinline class="w-full rounded-xl bg-black" style="height:28vh; object-fit:cover;"></video>
        <div class="flex justify-end mt-2">
          <button id="startMarkBtn" onclick="startFacialAttempt()" class="px-4 py-2 rounded-lg bg-sky-600 hover:bg-sky-700 font-semibold text-sm">
            <i class="fa-solid fa-camera"></i> Iniciar marcación
          </button>
        </div>
        <p id="faceStatus" class="text-center text-sm font-semibold mt-2">Presiona "Iniciar marcación" para identificarte.</p>
      </div>

      <div id="manualBox" class="hidden">
        <select id="employeeSelect" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-600 text-sm mb-3"></select>
        <label class="block text-xs font-semibold text-slate-300 mb-1">¿Por qué marcas manualmente? <span class="text-rose-400">*</span></label>
        <textarea id="manualReason" rows="2" maxlength="300" placeholder="Ej. La cámara no me reconoció" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-600 text-sm mb-1"></textarea>
        <p class="text-2xs text-slate-400 mb-3">Obligatorio. Queda registrado y el administrador recibe una alerta.</p>
        <button onclick="doManualMark()" class="w-full py-2.5 rounded-lg bg-sky-600 hover:bg-sky-700 font-semibold text-sm">Marcar ahora</button>
      </div>

      <div id="resultBox" class="mt-4 hidden"></div>
    </div>

    <div class="mt-4 text-center text-2xs text-slate-400">
      <i class="fa-solid fa-volume-high"></i> Voz: <span id="voiceLabel">-</span>
      · <button onclick="toggleVoicePanel()" class="underline hover:text-slate-200">Cambiar</button>
    </div>
    <div id="voicePanel" class="hidden mt-2 bg-slate-900/80 border border-slate-700 rounded-xl p-3 text-xs space-y-2">
      <label class="flex items-center gap-2"><input type="checkbox" id="voiceOn" onchange="saveVoiceSettings()" class="w-4 h-4"> Confirmar la marcación con voz</label>
      <select id="voiceSelect" onchange="saveVoiceSettings()" class="w-full px-2 py-2 rounded-lg bg-slate-800 border border-slate-600"></select>
      <button onclick="speakConfirmation({ employeeName: 'David Soto', markType: 'entrada', isSplit: false }, true)" class="w-full py-2 rounded-lg bg-slate-700 hover:bg-slate-600 font-semibold">Probar voz</button>
    </div>

    <button onclick="resetDevice()" class="w-full text-center text-2xs text-slate-500 hover:text-slate-300 mt-4">Cambiar dispositivo / token</button>

    <div class="flex-1"></div>
    <div class="text-center mb-4">
      <p class="text-xs text-slate-400 uppercase tracking-wider" id="deviceNameLabel"></p>
      <h1 class="font-bold text-xl">Punto de marcación</h1>
    </div>
   </div>
  </div>

<script>
const MARK_LABELS = { entrada: 'Entrada', inicio_almuerzo: 'Inicio de almuerzo', fin_almuerzo: 'Fin de almuerzo', salida: 'Salida' };
// Turno partido: mismas 4 marcaciones, con nombres de etapas.
const SPLIT_MARK_LABELS = { entrada: 'Inicio Etapa 1', inicio_almuerzo: 'Final Etapa 1', fin_almuerzo: 'Inicio Etapa 2', salida: 'Final Etapa 2' };
function markLabel(markType, isSplit) { return (isSplit ? SPLIT_MARK_LABELS : MARK_LABELS)[markType]; }
const FACE_MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';

// ---- Voz de confirmación (opción A: "Nombre. Entrada confirmada.") ----
// Usa las voces del propio equipo (sin internet ni costo). Prefiere una voz
// femenina en español; el administrador puede elegir otra en "Voz: Cambiar".
const VOICE_RATE = 1.10;
const VOICE_PITCH = 1.1;
const FEMALE_VOICE_HINTS = ['paulina', 'monica', 'mónica', 'marisol', 'soledad', 'angelica', 'angélica', 'francisca', 'sabina', 'helena', 'laura', 'elvira', 'dalia', 'salome', 'salomé', 'lupe', 'penelope', 'lucia', 'lucía', 'conchita', 'female', 'mujer', 'google español', 'es-us-x-', 'es-es-x-', 'ximena', 'catalina', 'paloma', 'isabela'];
let spanishVoices = [];
const hasSpeech = 'speechSynthesis' in window;
const isFemaleVoice = (v) => FEMALE_VOICE_HINTS.some(h => (v.name + ' ' + v.voiceURI).toLowerCase().includes(h));
const regionRank = (lang) => (/es-CO/i.test(lang) ? 0 : /es-(MX|US|419)/i.test(lang) ? 1 : /es-ES/i.test(lang) ? 2 : 3);
function loadSpanishVoices() {
  if (!hasSpeech) return;
  spanishVoices = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang));
  spanishVoices.sort((a, b) => (isFemaleVoice(b) - isFemaleVoice(a)) || (regionRank(a.lang) - regionRank(b.lang)) || a.name.localeCompare(b.name));
  renderVoicePanel();
}
function chosenVoice() {
  const saved = localStorage.getItem('kioskVoiceURI');
  return spanishVoices.find(v => v.voiceURI === saved) || spanishVoices[0] || null;
}
function voiceEnabled() { return hasSpeech && localStorage.getItem('kioskVoiceOn') !== '0'; }
function renderVoicePanel() {
  const label = document.getElementById('voiceLabel');
  const sel = document.getElementById('voiceSelect');
  const on = document.getElementById('voiceOn');
  if (!label) return;
  if (!hasSpeech) { label.textContent = 'no disponible en este navegador'; return; }
  const v = chosenVoice();
  label.textContent = !voiceEnabled() ? 'desactivada' : (v ? v.name : 'voz del sistema');
  on.checked = voiceEnabled();
  sel.innerHTML = spanishVoices.length
    ? spanishVoices.map(x => `<option value="${escapeHtml(x.voiceURI)}" ${v && x.voiceURI === v.voiceURI ? 'selected' : ''}>${escapeHtml(x.name)} (${escapeHtml(x.lang)})${isFemaleVoice(x) ? ' · femenina' : ''}</option>`).join('')
    : '<option value="">Este equipo no tiene voces en español instaladas</option>';
}
function toggleVoicePanel() { document.getElementById('voicePanel').classList.toggle('hidden'); }
function saveVoiceSettings() {
  localStorage.setItem('kioskVoiceOn', document.getElementById('voiceOn').checked ? '1' : '0');
  const uri = document.getElementById('voiceSelect').value;
  if (uri) localStorage.setItem('kioskVoiceURI', uri);
  renderVoicePanel();
}
// iPhone/iPad solo permiten hablar si la voz se "activa" con un toque del
// usuario: se llama al presionar "Iniciar marcación".
function primeSpeech() {
  if (!voiceEnabled()) return;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* sin voz */ }
}
// "David Soto. Entrada confirmada." (concordancia: entrada/salida -> confirmada;
// inicio/fin de almuerzo y etapas -> confirmado).
function confirmationText(r) {
  const label = markLabel(r.markType, r.isSplit) || 'Marcación';
  const fem = /^(entrada|salida)$/i.test(label);
  return `${r.employeeName}. ${label} ${fem ? 'confirmada' : 'confirmado'}.`;
}
function speakConfirmation(r, force) {
  if (!hasSpeech || (!force && !voiceEnabled())) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(confirmationText(r));
    const v = chosenVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'es-CO'; }
    u.rate = VOICE_RATE;
    u.pitch = VOICE_PITCH;
    speechSynthesis.speak(u);
  } catch (e) { /* si falla la voz, la marcación ya quedó registrada */ }
}
if (hasSpeech) {
  speechSynthesis.onvoiceschanged = loadSpanishVoices;
  setTimeout(loadSpanishVoices, 300);
  setTimeout(loadSpanishVoices, 1500);
}

function getToken() { return localStorage.getItem('kioskDeviceToken'); }

async function apiKiosk(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Device-Token': getToken(), ...(opts.headers || {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Error de conexión con el servidor.');
  return data;
}

async function saveDeviceToken() {
  const token = document.getElementById('setupTokenInput').value.trim();
  const errBox = document.getElementById('setupError');
  errBox.classList.add('hidden');
  if (!token) return;
  localStorage.setItem('kioskDeviceToken', token);
  try {
    await apiKiosk('/api/kiosk/employees-today');
    location.reload();
  } catch (e) {
    localStorage.removeItem('kioskDeviceToken');
    errBox.textContent = 'Token inválido: ' + e.message;
    errBox.classList.remove('hidden');
  }
}

function resetDevice() {
  if (!confirm('¿Quitar el token de este dispositivo? Tendrás que volver a configurarlo.')) return;
  stopCameraStream(document.getElementById('video'));
  localStorage.removeItem('kioskDeviceToken');
  location.reload();
}

async function init() {
  if (!getToken()) {
    document.getElementById('setupScreen').classList.remove('hidden');
    return;
  }
  document.getElementById('markScreen').classList.remove('hidden');
  setMode('facial');
}

// ---- Motor de reconocimiento facial (independiente del resto de la suite) ----
let faceApiLoadPromise = null;
function loadFaceApiScript() {
  if (window.faceapi) return Promise.resolve();
  if (faceApiLoadPromise) return faceApiLoadPromise;
  faceApiLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('No se pudo cargar la librería de reconocimiento facial.'));
    document.head.appendChild(s);
  });
  return faceApiLoadPromise;
}
let faceModelsLoaded = false;
async function ensureFaceModelsLoaded() {
  await loadFaceApiScript();
  if (faceModelsLoaded) return;
  await Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODEL_URL),
    faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODEL_URL),
    faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODEL_URL),
  ]);
  faceModelsLoaded = true;
}
async function startCameraOn(videoEl) {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
  videoEl.srcObject = stream;
  await new Promise(resolve => { videoEl.onloadedmetadata = resolve; });
  return stream;
}
function stopCameraStream(videoEl) {
  const stream = videoEl && videoEl.srcObject;
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (videoEl) videoEl.srcObject = null;
}
async function detectFaceOnce(videoEl) {
  const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
  const result = await faceapi.detectSingleFace(videoEl, options).withFaceLandmarks().withFaceDescriptor();
  return result || null;
}
let mode = 'facial';
let faceAttemptRunning = false;

function setMode(m) {
  mode = m;
  document.getElementById('modeBtnFacial').className = 'flex-1 px-3 py-2 rounded-lg text-xs font-bold ' + (m === 'facial' ? 'bg-sky-600' : 'bg-slate-700');
  document.getElementById('modeBtnManual').className = 'flex-1 px-3 py-2 rounded-lg text-xs font-bold ' + (m === 'manual' ? 'bg-sky-600' : 'bg-slate-700');
  document.getElementById('facialBox').classList.toggle('hidden', m !== 'facial');
  document.getElementById('manualBox').classList.toggle('hidden', m !== 'manual');
  document.getElementById('resultBox').classList.add('hidden');
  stopCameraStream(document.getElementById('video'));
  if (m === 'facial') {
    document.getElementById('faceStatus').textContent = 'Presiona "Iniciar marcación" para identificarte.';
  } else {
    loadEmployeesForManual();
  }
}

// La marcación facial NO corre sola: cada intento lo dispara el botón
// "Iniciar marcación", y se detiene por completo al terminar (ya sea con
// éxito o sin detectar rostro). Así se evita que, por error, un mismo
// colaborador quede marcando varias veces seguidas frente a la cámara.
async function startFacialAttempt() {
  if (faceAttemptRunning) return;
  faceAttemptRunning = true;
  const btn = document.getElementById('startMarkBtn');
  const statusEl = document.getElementById('faceStatus');
  const video = document.getElementById('video');
  btn.disabled = true;
  btn.classList.add('opacity-50');
  primeSpeech();
  document.getElementById('resultBox').classList.add('hidden');
  try {
    statusEl.textContent = 'Cargando modelo…';
    await ensureFaceModelsLoaded();
    statusEl.textContent = 'Iniciando cámara…';
    await startCameraOn(video);
    statusEl.textContent = 'Buscando rostro…';
    await runSingleFaceAttempt();
  } catch (e) {
    statusEl.textContent = 'No se pudo activar la cámara: ' + e.message;
  }
  stopCameraStream(video);
  btn.disabled = false;
  btn.classList.remove('opacity-50');
  faceAttemptRunning = false;
}

// Un solo intento: busca un rostro con lectura estable durante unos 10
// segundos como máximo: si lo logra, marca; si no, se detiene y avisa.
async function runSingleFaceAttempt() {
  const video = document.getElementById('video');
  const statusEl = document.getElementById('faceStatus');
  let stableCount = 0;
  const maxTries = 40; // 40 x 250ms ≈ 10 segundos
  for (let i = 0; i < maxTries; i++) {
    try {
      const det = await detectFaceOnce(video);
      if (det) {
        stableCount++;
        statusEl.textContent = 'Rostro detectado, verificando…';
        if (stableCount >= 3) {
          // Detección estable durante ~750ms (evita un falso positivo de un
          // solo cuadro) -> aceptar y marcar.
          statusEl.textContent = 'Verificando…';
          const descriptor = Array.from(det.descriptor);
          await submitFaceMark(descriptor);
          return;
        }
      } else {
        stableCount = 0;
        statusEl.textContent = 'Buscando rostro…';
      }
    } catch (e) { /* reintenta */ }
    await new Promise(r => setTimeout(r, 250));
  }
  statusEl.textContent = 'No se detectó un rostro. Presiona "Iniciar marcación" para intentar de nuevo.';
}

async function submitFaceMark(descriptor) {
  const statusEl = document.getElementById('faceStatus');
  try {
    const r = await apiKiosk('/api/kiosk/mark-by-face', { method: 'POST', body: JSON.stringify({ descriptor }) });
    renderResult(r);
    speakConfirmation(r);
    statusEl.textContent = 'Listo. Presiona "Iniciar marcación" para el siguiente colaborador.';
  } catch (e) {
    statusEl.textContent = e.message;
  }
}

function renderResult(r) {
  const box = document.getElementById('resultBox');
  box.className = 'mt-4 bg-slate-800 border border-slate-700 rounded-xl p-4';
  box.innerHTML = `
    <p class="font-bold text-lg">${escapeHtml(r.employeeName)}</p>
    <p class="text-sky-400 font-extrabold text-2xl">${markLabel(r.markType, r.isSplit)}</p>
    <p class="text-sm text-slate-300">Hora: <strong>${r.actualTime}</strong></p>
    ${r.alert ? `<p class="text-rose-400 text-xs mt-2"><i class="fa-solid fa-triangle-exclamation"></i> ${escapeHtml(r.isSplit && r.alert.type === 'exceso_almuerzo' ? 'Regresó tarde a la Etapa 2' : r.alert.type)}</p>` : ''}
  `;
  box.classList.remove('hidden');
}

async function loadEmployeesForManual() {
  const sel = document.getElementById('employeeSelect');
  sel.innerHTML = '<option>Cargando…</option>';
  try {
    const { deviceName, employees } = await apiKiosk('/api/kiosk/employees-today');
    document.getElementById('deviceNameLabel').textContent = deviceName;
    if (employees.length === 0) { sel.innerHTML = '<option value="">Sin colaboradores asignados a este dispositivo.</option>'; return; }
    sel.innerHTML = employees.map(e => {
      if (!e.hasShift) return `<option value="${e.id}" data-noshift="1">${escapeHtml(e.name)} — sin turno hoy</option>`;
      if (e.completed) return `<option value="${e.id}" data-noshift="1">${escapeHtml(e.name)} — turno completo</option>`;
      return `<option value="${e.id}">${escapeHtml(e.name)} — ${markLabel(e.nextMark, e.isSplit)}</option>`;
    }).join('');
  } catch (e) {
    sel.innerHTML = `<option value="">${escapeHtml(e.message)}</option>`;
  }
}

async function doManualMark() {
  const sel = document.getElementById('employeeSelect');
  if (!sel.value || sel.selectedOptions[0]?.dataset.noshift) return;
  const reasonEl = document.getElementById('manualReason');
  const reason = (reasonEl.value || '').trim();
  if (reason.length < 5) {
    const box = document.getElementById('resultBox');
    box.className = 'mt-4 bg-rose-900/50 border border-rose-700 rounded-xl p-4 text-rose-200 text-sm';
    box.textContent = 'Escribe por qué marcas manualmente (mínimo 5 caracteres).';
    box.classList.remove('hidden');
    reasonEl.focus();
    return;
  }
  try {
    const r = await apiKiosk('/api/kiosk/mark', { method: 'POST', body: JSON.stringify({ employeeId: Number(sel.value), reason }) });
    reasonEl.value = '';
    renderResult(r);
    loadEmployeesForManual();
  } catch (e) {
    document.getElementById('resultBox').className = 'mt-4 bg-rose-900/50 border border-rose-700 rounded-xl p-4 text-rose-200 text-sm';
    document.getElementById('resultBox').innerHTML = escapeHtml(e.message);
    document.getElementById('resultBox').classList.remove('hidden');
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

init();

// Al usar /kiosk.html, se muestra el nombre del dispositivo si ya hay token
if (getToken()) {
  apiKiosk('/api/kiosk/employees-today').then(d => {
    document.getElementById('deviceNameLabel').textContent = d.deviceName;
  }).catch(() => {});
}
</script>
</body>
</html>
