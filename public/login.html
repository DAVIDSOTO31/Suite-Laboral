<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesion - RR.HH PYMES</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-sky-600 text-white text-2xl mb-3">
        <i class="fa-solid fa-clock"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">RR.HH PYMES</h1>
      <p class="text-slate-500 text-sm">Control de horarios multi-organizacion</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-lg font-semibold text-slate-800 mb-4">Iniciar sesion</h2>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Correo electronico</label>
          <input type="email" id="email" required autocomplete="username"
            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm" placeholder="tucorreo@empresa.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Contrasena</label>
          <input type="password" id="password" required autocomplete="current-password"
            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm" placeholder="********">
        </div>
        <div id="errorBox" class="hidden text-sm text-rose-600 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"></div>
        <button type="submit" id="submitBtn"
          class="w-full py-2.5 rounded-lg bg-sky-600 hover:bg-sky-700 text-white font-semibold text-sm transition">
          Ingresar
        </button>
      </form>
      <div class="mt-4 text-center">
        <a href="/forgot-password.html" class="text-xs text-sky-600 hover:underline">Olvide mi contrasena</a>
      </div>
    </div>
    <p class="text-center text-xs text-slate-400 mt-6">Si un administrador te invito, revisa tu correo para activar tu cuenta.</p>
  </div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errorBox = document.getElementById('errorBox');
  errorBox.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Ingresando...';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorBox.textContent = data.error || 'No se pudo iniciar sesion.';
      errorBox.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Ingresar';
      return;
    }
    if (data.user.isSuperAdmin) {
      window.location.href = '/superadmin.html';
    } else {
      window.location.href = '/app.html';
    }
  } catch (err) {
    errorBox.textContent = 'Error de conexion con el servidor.';
    errorBox.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Ingresar';
  }
});
</script>
</body>
</html>
