<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesion - RR.HH PYMES</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  /* Fondo ejecutivo azul con formas suaves en movimiento */
  body {
    background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 45%, #dbeafe 100%);
    overflow-x: hidden;
  }
  .bg-blob {
    position: fixed;
    border-radius: 9999px;
    filter: blur(60px);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
  }
  .blob-1 {
    width: 420px; height: 420px;
    top: -120px; left: -100px;
    background: #38bdf8;
    animation: float1 16s ease-in-out infinite;
  }
  .blob-2 {
    width: 380px; height: 380px;
    bottom: -140px; right: -100px;
    background: #1e40af;
    opacity: 0.35;
    animation: float2 20s ease-in-out infinite;
  }
  .blob-3 {
    width: 300px; height: 300px;
    top: 40%; left: 60%;
    background: #7dd3fc;
    opacity: 0.4;
    animation: float3 22s ease-in-out infinite;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(60px, 40px) scale(1.12); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-50px, -30px) scale(1.08); }
  }
  @keyframes float3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-40px, 50px) scale(0.9); }
  }
  .content-layer { position: relative; z-index: 10; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="w-full max-w-md content-layer">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-sky-500 via-sky-600 to-blue-800 text-white shadow-lg shadow-sky-600/30 border border-sky-400/40 mb-3">
        <svg class="w-9 h-9" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 2 L43 13 V35 L24 46 L5 35 V13 Z" fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"/>
          <circle cx="24" cy="18" r="5" fill="currentColor"/>
          <path d="M14 34c0-6 4.5-10 10-10s10 4 10 10v2H14v-2Z" fill="currentColor"/>
          <circle cx="12" cy="22" r="3" fill="currentColor" opacity="0.75"/>
          <path d="M6 33c0-3.5 2.6-6.2 6-6.2 1.5 0 2.8.5 3.8 1.4-1 1.3-1.6 3-1.6 4.8v2H6v-2Z" fill="currentColor" opacity="0.75"/>
          <circle cx="36" cy="22" r="3" fill="currentColor" opacity="0.75"/>
          <path d="M42 33c0-3.5-2.6-6.2-6-6.2-1.5 0-2.8.5-3.8 1.4 1 1.3 1.6 3 1.6 4.8v2h8.2v-2Z" fill="currentColor" opacity="0.75"/>
          <circle cx="36" cy="34" r="6" fill="#10b981"/>
          <path d="M33 34l2 2 4-4" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">RR.HH PYMES</h1>
      <p class="text-slate-500 text-sm">Administración de Personal & Horarios</p>
    </div>

    <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl border border-slate-200 p-6">
      <h2 class="text-lg font-semibold text-slate-800 mb-4">Iniciar sesion</h2>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Correo electronico</label>
          <input type="email" id="email" required autocomplete="username"
            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm" placeholder="tucorreo@empresa.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Contrasena</label>
          <input type="password" id="password" required autocomplete="current-password"
            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm" placeholder="********">
        </div>
        <div id="errorBox" class="hidden text-sm text-rose-600 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"></div>
        <button type="submit" id="submitBtn"
          class="w-full py-2.5 rounded-lg bg-sky-600 hover:bg-sky-700 text-white font-semibold text-sm transition">
          Ingresar
        </button>
      </form>
      <div class="mt-4 text-center">
        <a href="/forgot-password.html" class="text-xs text-sky-600 hover:underline">Olvide mi contrasena</a>
      </div>
    </div>
    <p class="text-center text-xs text-slate-500 mt-6">Si un administrador te invito, revisa tu correo para activar tu cuenta.</p>
  </div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errorBox = document.getElementById('errorBox');
  errorBox.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Ingresando...';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorBox.textContent = data.error || 'No se pudo iniciar sesion.';
      errorBox.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Ingresar';
      return;
    }
    if (data.user.isSuperAdmin) {
      window.location.href = '/superadmin.html';
    } else {
      window.location.href = '/app.html';
    }
  } catch (err) {
    errorBox.textContent = 'Error de conexion con el servidor.';
    errorBox.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Ingresar';
  }
});
</script>
</body>
</html>
