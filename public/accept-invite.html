<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activar cuenta - RR.HH PYMES</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
    <h1 class="text-lg font-semibold text-slate-800 mb-1">Activa tu cuenta</h1>
    <p class="text-sm text-slate-500 mb-4">Elige una contrasena para completar tu registro (minimo 8 caracteres).</p>
    <form id="form" class="space-y-4">
      <input type="password" id="password" required minlength="8" placeholder="Nueva contrasena"
        class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm">
      <input type="password" id="password2" required minlength="8" placeholder="Confirma la contrasena"
        class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm">
      <div id="msg" class="hidden text-sm rounded-lg px-3 py-2"></div>
      <button type="submit" class="w-full py-2.5 rounded-lg bg-sky-600 hover:bg-sky-700 text-white font-semibold text-sm">Activar cuenta</button>
    </form>
  </div>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
if (!token) {
  document.body.innerHTML = '<div class="p-6 text-center text-slate-600">Enlace de invitacion invalido.</div>';
}
document.getElementById('form')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const p1 = document.getElementById('password').value;
  const p2 = document.getElementById('password2').value;
  if (p1 !== p2) {
    msg.textContent = 'Las contrasenas no coinciden.';
    msg.className = 'text-sm rounded-lg px-3 py-2 bg-rose-50 text-rose-700 border border-rose-200';
    return;
  }
  const res = await fetch('/api/auth/accept-invite', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, password: p1 }),
  });
  const data = await res.json();
  if (res.ok) {
    msg.textContent = 'Cuenta activada. Redirigiendo al inicio de sesion...';
    msg.className = 'text-sm rounded-lg px-3 py-2 bg-emerald-50 text-emerald-700 border border-emerald-200';
    setTimeout(() => location.href = '/login.html', 1500);
  } else {
    msg.textContent = data.error || 'No se pudo activar la cuenta.';
    msg.className = 'text-sm rounded-lg px-3 py-2 bg-rose-50 text-rose-700 border border-rose-200';
  }
});
</script>
</body>
</html>
