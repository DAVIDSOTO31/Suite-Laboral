<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contrasena - RR.HH PYMES</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
    <h1 class="text-lg font-semibold text-slate-800 mb-1">Recuperar contrasena</h1>
    <p class="text-sm text-slate-500 mb-4">Ingresa tu correo y te enviaremos un enlace para restablecer tu contrasena.</p>
    <form id="form" class="space-y-4">
      <input type="email" id="email" required placeholder="tucorreo@empresa.com"
        class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm">
      <div id="msg" class="hidden text-sm rounded-lg px-3 py-2"></div>
      <button type="submit" class="w-full py-2.5 rounded-lg bg-sky-600 hover:bg-sky-700 text-white font-semibold text-sm">Enviar enlace</button>
    </form>
    <div class="mt-4 text-center"><a href="/login.html" class="text-xs text-sky-600 hover:underline">Volver a iniciar sesion</a></div>
  </div>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const res = await fetch('/api/auth/forgot-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: document.getElementById('email').value.trim() }),
  });
  const data = await res.json();
  msg.textContent = data.message || 'Si el correo existe, revisa tu bandeja de entrada.';
  msg.className = 'text-sm rounded-lg px-3 py-2 bg-emerald-50 text-emerald-700 border border-emerald-200';
});
</script>
</body>
</html>
